{% extends "base.html" %}
{% block titulo %}Routers · Portal WISP{% endblock %}
{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Routers MikroTik</h2>
    <a href="{% url 'mikrotik:nuevo' %}" class="btn btn-primary">+ Nuevo router</a>
</div>

<form class="row g-2 mb-3"
      hx-get="{% url 'mikrotik:lista' %}"
      hx-target="#tabla-routers"
      hx-trigger="input changed delay:400ms from:#id_q, change from:#id_sector"
      hx-push-url="true">
    <div class="col-md-8">
        <input type="text" name="q" id="id_q" class="form-control"
               placeholder="Buscar por nombre, IP o modelo..." value="{{ busqueda }}">
    </div>
    <div class="col-md-4">
        <select name="sector" id="id_sector" class="form-select">
            <option value="">Todos los sectores</option>
            {% for s in sectores %}
            <option value="{{ s.pk }}" {% if s.pk|stringformat:'s' == sector_seleccionado %}selected{% endif %}>{{ s.nombre }}</option>
            {% endfor %}
        </select>
    </div>
</form>

<div id="tabla-routers">
    {% include "mikrotik/_tabla.html" %}
</div>
{% endblock %}
