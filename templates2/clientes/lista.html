{% extends "base.html" %}
{% block titulo %}Clientes · Portal WISP{% endblock %}
{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Clientes</h2>
    <a href="{% url 'clientes:nuevo' %}" class="btn btn-primary">+ Nuevo cliente</a>
</div>

<form class="row g-2 mb-3"
      hx-get="{% url 'clientes:lista' %}"
      hx-target="#tabla-clientes"
      hx-trigger="input changed delay:400ms from:#id_q, change from:#id_poblacion, change from:#id_estado"
      hx-push-url="true">
    <div class="col-md-5">
        <input type="text" name="q" id="id_q" class="form-control"
               placeholder="Buscar por nombre, apodo, documento o teléfono..." value="{{ busqueda }}">
    </div>
    <div class="col-md-4">
        <select name="poblacion" id="id_poblacion" class="form-select">
            <option value="">Todas las poblaciones</option>
            {% for p in poblaciones %}
            <option value="{{ p }}" {% if p == poblacion_seleccionada %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <select name="estado" id="id_estado" class="form-select">
            <option value="">Todos</option>
            <option value="activos" {% if estado_seleccionado == 'activos' %}selected{% endif %}>Activos</option>
            <option value="inactivos" {% if estado_seleccionado == 'inactivos' %}selected{% endif %}>Inactivos</option>
        </select>
    </div>
</form>

<div id="tabla-clientes">
    {% include "clientes/_tabla.html" %}
</div>
{% endblock %}
