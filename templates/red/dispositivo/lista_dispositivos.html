{% extends "base.html" %}
{% block titulo %}Red · Dispositivos · Portal WISP{% endblock %}
{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Dispositivos</h2>
    <a href="{% url 'red:lista' %}" class="btn btn-outline-secondary">Ver por sectores</a>
</div>

<form class="row g-2 mb-3"
      hx-get="{% url 'red:lista_dispositivos' %}"
      hx-target="#tabla-dispositivos"
      hx-trigger="input changed delay:400ms from:#id_q, change from:#id_tipo, change from:#id_estado"
      hx-push-url="true">
    <div class="col-md-6">
        <input type="text" name="q" id="id_q" class="form-control"
               placeholder="Buscar por nombre, modelo, IP o MAC..." value="{{ busqueda }}">
    </div>
    <div class="col-md-3">
<select name="tipo" id="id_tipo" class="form-select">
            <option value="">Todos los tipos</option>
            {% for valor, etiqueta in tipos_dispositivo %}
            <option value="{{ valor }}" {% if valor == tipo_seleccionado %}selected{% endif %}>{{ etiqueta }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <select name="estado" id="id_estado" class="form-select">
            <option value="">Todos los estados</option>
            <option value="activo" {% if estado_seleccionado == 'activo' %}selected{% endif %}>Activo</option>
            <option value="inactivo" {% if estado_seleccionado == 'inactivo' %}selected{% endif %}>Inactivo</option>
            <option value="mantenimiento" {% if estado_seleccionado == 'mantenimiento' %}selected{% endif %}>En mantenimiento</option>
        </select>
    </div>
</form>

<div id="tabla-dispositivos">
    {% include "red/dispositivo/_tabla_dispositivos.html" %}
</div>
{% endblock %}
