{% extends "base.html" %}
{% block titulo %}Red · Sectores · Portal WISP{% endblock %}
{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Sectores</h2>
    <a href="{% url 'red:nuevo_sector' %}" class="btn btn-primary">+ Nuevo sector</a>
</div>

<form class="row g-2 mb-3"
      hx-get="{% url 'red:lista' %}"
      hx-target="#tabla-sectores"
      hx-trigger="input changed delay:400ms from:#id_q"
      hx-push-url="true">
    <div class="col-md-8">
        <input type="text" name="q" id="id_q" class="form-control"
               placeholder="Buscar por nombre o población..." value="{{ busqueda }}">
    </div>
    <div class="col-md-4 d-flex align-items-end">
        <button class="btn btn-outline-secondary w-100" type="reset"
                onclick="document.getElementById('id_q').value=''; htmx.trigger(document.querySelector('#id_q'), 'input');">Limpiar</button>
    </div>
</form>

<div id="tabla-sectores">
    {% include "red/_tabla.html" %}
</div>
{% endblock %}
