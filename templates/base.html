<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Portal WISP{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <span class="navbar-brand">Portal WISP</span>
        {% if user.is_authenticated %}
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'clientes:lista' %}">Clientes</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'mikrotik:lista' %}">Routers</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'red:lista' %}">Red</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'red:lista_dispositivos' %}">Dispositivos</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white-50 small">{{ user.get_full_name|default:user.username }} · {{ user.get_rol_display }}</span>
            <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-light">Cerrar sesión</a>
        </div>
        {% endif %}
    </nav>
    <main class="container py-4">
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
